<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1015" />

    <!-- Resolve and apply the theme before first paint so there is no flash of
         the wrong theme. Keep the token values in sync with src/app/styles/index.css
         and src/shared/lib/theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ig-theme");
          var theme =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          document.documentElement.dataset.theme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute(
              "content",
              resolved === "dark" ? "#0d1015" : "#ffffff",
            );
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <title>Instagram</title>
    <meta
      name="description"
      content="Share photos and stories, follow people, and explore posts — an Instagram clone built with React and GraphQL."
    />

    <link rel="icon" type="image/png" href="/ig-logo.png" />
    <link rel="apple-touch-icon" href="/ig-logo.png" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Instagram" />
    <meta
      property="og:description"
      content="Share photos and stories, follow people, and explore posts."
    />
    <meta property="og:image" content="/ig-logo.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Warm up the font origins before the stylesheet request -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "instagram-frontend/**" # Only trigger if frontend code changes
  pull_request:
    branches:
      - main
    paths:
      - "instagram-frontend/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: "./instagram-frontend/yarn.lock"

      - name: Install Dependencies
        run: |
          cd instagram-frontend
          yarn install --frozen-lockfile

      - name: Lint
        run: |
          cd instagram-frontend
          yarn lint

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Build Project
        run: |
          cd instagram-frontend
          # 1. Run the standard Vite build with your secrets
          yarn build

          # 2. Manually create the folder structure Vercel '--prebuilt' requires
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static

          # 3. Build Output API config: security + cache headers, then the SPA
          # fallback. --prebuilt reads this and ignores vercel.json, so this is
          # the source of truth for production headers (mirrored in vercel.json).
          cat <<'EOF' > .vercel/output/config.json
          {
            "version": 3,
            "routes": [
              {
                "src": "/(.*)",
                "headers": {
                  "X-Content-Type-Options": "nosniff",
                  "X-Frame-Options": "DENY",
                  "Referrer-Policy": "strict-origin-when-cross-origin",
                  "Permissions-Policy": "camera=(), microphone=(), geolocation=()",
                  "Strict-Transport-Security": "max-age=63072000; includeSubDomains; preload",
                  "Content-Security-Policy": "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https: wss:"
                },
                "continue": true
              },
              {
                "src": "/assets/(.*)",
                "headers": { "Cache-Control": "public, max-age=31536000, immutable" },
                "continue": true
              },
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

          echo "✅ .vercel/output/config.json created with version 3"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Vercel
        # This condition ensures deployment ONLY happens on a push/merge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # 1. Navigate to the frontend folder
          cd instagram-frontend

          # 2. Run deploy from here. 
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_USER_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
